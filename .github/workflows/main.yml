name: Build iPhone Secreto IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ -f "iphone-secreto.zip" ]; then
            unzip -o iphone-secreto.zip
          fi
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project iPhoneSecreto.xcodeproj \
            -scheme iPhoneSecreto \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iPhoneSecreto.app Payload/
          zip -r iPhoneSecreto.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneSecreto-IPA
          path: iPhoneSecreto.ipa
          
